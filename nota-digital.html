<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Nota Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#E4032B;
    --red-dark:#A80220;
    --red-soft:#FFF1EF;
    --yellow:#FFCC00;
    --yellow-dark:#E0B400;
    --ink:#241812;
    --ink-soft:#7A6A62;
    --paper:#FFFDF8;
    --line:#F0DED6;
    --white:#FFFFFF;
    --green:#1E8E3E;
    --shadow: 0 10px 30px rgba(168,2,32,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: linear-gradient(180deg, var(--red) 0%, var(--red) 140px, #FDF3EC 140px, #FDF3EC 100%);
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    min-height:100vh;
    -webkit-tap-highlight-color: transparent;
  }
  .display{font-family:'Baloo 2',system-ui,sans-serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  .app{
    max-width:460px;
    margin:0 auto;
    min-height:100vh;
    padding-bottom:110px;
    position:relative;
  }

  /* ---------- HEADER ---------- */
  header.topbar{
    padding:18px 18px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    color:#fff;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-badge{
    width:42px;height:42px;border-radius:14px;
    background:var(--yellow);
    display:flex;align-items:center;justify-content:center;
    font-family:'Baloo 2';font-weight:800;font-size:20px;color:var(--red-dark);
    box-shadow: inset 0 -3px 0 rgba(0,0,0,0.12);
  }
  .brand-text .name{font-family:'Baloo 2';font-weight:700;font-size:19px;line-height:1.1;}
  .brand-text .sub{font-size:11.5px;opacity:.85;margin-top:2px;}
  .icon-btn{
    width:38px;height:38px;border-radius:12px;
    background:rgba(255,255,255,0.18);
    border:none;color:#fff;font-size:18px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .icon-btn:active{background:rgba(255,255,255,0.32);}

  /* ---------- CARD ---------- */
  .card{
    background:var(--white);
    border-radius:20px;
    box-shadow:var(--shadow);
    padding:16px;
    margin:0 14px 14px;
  }
  .card h3{
    font-family:'Baloo 2';
    font-size:14px;
    margin:0 0 10px;
    color:var(--red-dark);
    display:flex;align-items:center;gap:6px;
  }

  /* ---------- QUICK CHIPS ---------- */
  .chip-row{
    display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;
    scrollbar-width:none;
  }
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    background:var(--red-soft);
    border:1px solid #FBD9D4;
    color:var(--red-dark);
    padding:9px 14px;
    border-radius:999px;
    font-size:12.5px;
    font-weight:600;
    white-space:nowrap;
    cursor:pointer;
  }
  .chip:active{background:#FFE1DC;}
  .chip-empty{
    font-size:12px;color:var(--ink-soft);padding:8px 2px;
  }

  /* ---------- FORM ---------- */
  .field{margin-bottom:10px;}
  .field label{
    display:block;font-size:11.5px;font-weight:600;
    color:var(--ink-soft);margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em;
  }
  input[type=text], input[type=number], select{
    width:100%;
    border:1.5px solid #EDE2DC;
    background:#FCFAF8;
    border-radius:12px;
    padding:12px 13px;
    font-size:15.5px;
    font-family:'Inter';
    color:var(--ink);
    outline:none;
  }
  input:focus, select:focus{border-color:var(--red);background:#fff;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  .qty-stepper{
    display:flex;align-items:center;
    border:1.5px solid #EDE2DC;border-radius:12px;background:#FCFAF8;overflow:hidden;
  }
  .qty-stepper button{
    width:40px;height:44px;border:none;background:transparent;
    font-size:18px;font-weight:700;color:var(--red-dark);cursor:pointer;
  }
  .qty-stepper button:active{background:#F3E3DF;}
  .qty-stepper input{
    border:none;background:transparent;text-align:center;
    width:100%;padding:0;font-weight:700;font-size:15.5px;
  }

  .btn{
    border:none;border-radius:14px;
    font-family:'Baloo 2';font-weight:700;font-size:15.5px;
    padding:14px;width:100%;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn-primary{
    background:var(--yellow);color:var(--red-dark);
    box-shadow:0 4px 0 var(--yellow-dark);
  }
  .btn-primary:active{transform:translateY(3px);box-shadow:0 1px 0 var(--yellow-dark);}
  .btn-dark{
    background:var(--red);color:#fff;
    box-shadow:0 4px 0 var(--red-dark);
  }
  .btn-dark:active{transform:translateY(3px);box-shadow:0 1px 0 var(--red-dark);}
  .btn-ghost{
    background:#fff;color:var(--red-dark);border:1.5px solid #F3D9D3;
  }
  .btn[disabled]{opacity:.45;pointer-events:none;}

  /* ---------- CART ---------- */
  .cart-item{
    display:flex;align-items:center;gap:10px;
    padding:11px 0;border-bottom:1px dashed var(--line);
  }
  .cart-item:last-child{border-bottom:none;}
  .cart-item .info{flex:1;min-width:0;}
  .cart-item .pname{font-weight:600;font-size:14.5px;}
  .cart-item .pmeta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .cart-item .psub{font-weight:700;font-size:14px;white-space:nowrap;}
  .cart-item .del{
    width:30px;height:30px;border-radius:9px;border:none;
    background:#FDEEEE;color:var(--red);font-size:15px;cursor:pointer;flex:0 0 auto;
  }
  .cart-empty{
    text-align:center;color:var(--ink-soft);font-size:13.5px;padding:22px 10px;
  }
  .cart-empty .big{font-size:30px;display:block;margin-bottom:6px;}

  /* ---------- STICKY TOTAL BAR ---------- */
  .stickybar{
    position:fixed;left:0;right:0;bottom:0;
    background:var(--white);
    box-shadow:0 -8px 24px rgba(0,0,0,0.09);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    max-width:460px;margin:0 auto;
  }
  .stickybar-inner{display:flex;align-items:center;gap:12px;}
  .total-block{flex:0 0 auto;}
  .total-block .lbl{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
  .total-block .val{font-family:'Baloo 2';font-size:19px;color:var(--red-dark);font-weight:700;}
  .stickybar .btn{flex:1;}

  /* ---------- TOAST ---------- */
  .toast{
    position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;
    font-size:13px;font-weight:600;opacity:0;pointer-events:none;
    transition:all .25s ease; z-index:50; white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---------- NOTA VIEW ---------- */
  #notaScreen{display:none;padding:18px 14px 30px;}
  .nota-card{
    background:var(--paper);
    border-radius:4px;
    padding:26px 20px 18px;
    position:relative;
    box-shadow:var(--shadow);
    max-width:400px;margin:0 auto;
  }
  .zig-top, .zig-bottom{
    position:absolute;left:0;right:0;height:14px;
    background:
      linear-gradient(135deg, var(--paper) 25%, transparent 25%) 0 0,
      linear-gradient(225deg, var(--paper) 25%, transparent 25%) 0 0;
    background-size:16px 16px;
    background-color:transparent;
  }
  .zig-top{top:-1px;transform:rotate(180deg);background-color:#FDF3EC;}
  .zig-bottom{bottom:-1px;background-color:#FDF3EC;}
  .nota-head{text-align:center;margin-bottom:14px;}
  .nota-head .store{font-family:'Baloo 2';font-weight:700;font-size:20px;color:var(--red-dark);}
  .nota-head .addr{font-size:11.5px;color:var(--ink-soft);margin-top:3px;}
  .nota-meta{font-size:12px;line-height:1.75;margin:14px 0;}
  .nota-meta .r{display:flex;justify-content:space-between;gap:10px;}
  .nota-meta .r span:first-child{color:var(--ink-soft);}
  .dashed{border-top:1.5px dashed #D9C6BD;margin:12px 0;}
  .nota-items .li{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;gap:8px;}
  .nota-items .li .l{flex:1;}
  .nota-items .li .qtyline{color:var(--ink-soft);font-size:11.5px;display:block;margin-top:1px;}
  .nota-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;}
  .nota-total .lbl{font-family:'Baloo 2';font-weight:700;font-size:15px;}
  .nota-total .val{font-family:'Baloo 2';font-weight:800;font-size:21px;color:var(--red-dark);}
  .nota-foot{text-align:center;margin-top:16px;font-size:12px;color:var(--ink-soft);}
  .nota-foot .smile{font-size:18px;margin-top:4px;}
  .nota-actions{display:flex;gap:10px;margin-top:18px;max-width:400px;margin-left:auto;margin-right:auto;}

  /* ---------- SETTINGS MODAL ---------- */
  .overlay{
    display:none;position:fixed;inset:0;background:rgba(36,24,18,0.45);
    z-index:100;align-items:flex-end;justify-content:center;
  }
  .overlay.show{display:flex;}
  .sheet{
    background:#fff;width:100%;max-width:460px;border-radius:20px 20px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    animation:slideup .2s ease;
  }
  @keyframes slideup{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .sheet h3{font-family:'Baloo 2';color:var(--red-dark);margin:0 0 14px;font-size:17px;}
  .sheet-actions{display:flex;gap:10px;margin-top:14px;}

  /* ---------- PRINT ---------- */
  @media print{
    body{background:#fff !important;}
    .app{max-width:100%;padding-bottom:0;}
    header.topbar, .stickybar, #inputScreen, .nota-actions, .toast, .overlay{display:none !important;}
    #notaScreen{display:block !important;padding:0;}
    .nota-card{box-shadow:none;max-width:340px;margin:0 auto;}
  }
</style>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <div class="brand-badge">:)</div>
      <div class="brand-text">
        <div class="name" id="brandName">Depo MDJ</div>
        <div class="sub" id="brandDate">-</div>
      </div>
    </div>
    <button class="icon-btn" onclick="openSettings()" title="Pengaturan">⚙</button>
  </header>

  <!-- ================= INPUT SCREEN ================= -->
  <div id="inputScreen">

    <div class="card">
      <h3>🔥 Produk cepat</h3>
      <div class="chip-row" id="chipRow"></div>
    </div>

    <div class="card">
      <h3>➕ Tambah item</h3>
      <div class="field">
        <label>Nama produk</label>
        <input type="text" id="fName" placeholder="Contoh: Go-Rice Crackers 3pcs">
      </div>
      <div class="row2">
        <div class="field">
          <label>Harga satuan</label>
          <input type="number" id="fHarga" placeholder="0" inputmode="numeric">
        </div>
        <div class="field">
          <label>Qty</label>
          <div class="qty-stepper">
            <button type="button" onclick="stepQty(-1)">−</button>
            <input type="number" id="fQty" value="1" min="1" inputmode="numeric">
            <button type="button" onclick="stepQty(1)">+</button>
          </div>
        </div>
      </div>
      <button class="btn btn-primary" onclick="addItem()">+ Tambah ke Nota</button>
    </div>

    <div class="card">
      <h3>🧾 Keranjang <span id="cartCount" style="color:var(--ink-soft);font-weight:400;"></span></h3>
      <div id="cartList"></div>
    </div>

    <div class="card">
      <h3>🏪 Tujuan</h3>
      <div class="field">
        <label>Nama toko / pembeli</label>
        <input type="text" id="fToko" placeholder="Nama toko tujuan">
      </div>
      <div class="field">
        <label>Sales</label>
        <select id="fSales" onchange="handleSalesChange()">
          <option value="">Pilih sales…</option>
        </select>
      </div>
      <div class="field" id="fSalesCustomWrap" style="display:none;">
        <label>Nama sales lainnya</label>
        <input type="text" id="fSalesCustom" placeholder="Tulis nama sales">
      </div>
    </div>

  </div>

  <!-- ================= NOTA SCREEN ================= -->
  <div id="notaScreen">
    <div class="nota-card">
      <div class="zig-top"></div>
      <div class="nota-head">
        <div class="store" id="notaStore">Depo MDJ</div>
        <div class="addr" id="notaAddr"></div>
      </div>
      <div class="nota-meta">
        <div class="r"><span>No. Nota</span><span class="mono" id="notaNo">-</span></div>
        <div class="r"><span>Tanggal</span><span class="mono" id="notaTgl">-</span></div>
        <div class="r"><span>Sales</span><span id="notaSales">-</span></div>
        <div class="r"><span>Toko</span><span id="notaToko">-</span></div>
      </div>
      <div class="dashed"></div>
      <div class="nota-items" id="notaItems"></div>
      <div class="dashed"></div>
      <div class="nota-total">
        <div class="lbl">TOTAL</div>
        <div class="val mono" id="notaTotal">Rp 0</div>
      </div>
      <div class="nota-foot">
        Terima kasih atas pesanan Anda
        <div class="smile">:)</div>
      </div>
      <div class="zig-bottom"></div>
    </div>
    <div class="nota-actions">
      <button class="btn btn-ghost" onclick="backToForm()">← Edit</button>
      <button class="btn btn-dark" onclick="window.print()">🖨 Cetak</button>
      <button class="btn btn-primary" onclick="newNota()">Nota Baru</button>
    </div>
  </div>

  <!-- ================= STICKY TOTAL ================= -->
  <div class="stickybar" id="stickybar">
    <div class="stickybar-inner">
      <div class="total-block">
        <div class="lbl">Total</div>
        <div class="val" id="stickyTotal">Rp 0</div>
      </div>
      <button class="btn btn-dark" id="btnBuatNota" onclick="generateNota()" disabled>Buat Nota →</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- ================= SETTINGS SHEET ================= -->
  <div class="overlay" id="settingsOverlay" onclick="if(event.target===this) closeSettings()">
    <div class="sheet">
      <h3>Pengaturan Gudang</h3>
      <div class="field">
        <label>Nama gudang / depo</label>
        <select id="sDepot" onchange="handleDepotChange()">
          <option>Depo MDJ</option>
          <option>Depo KOPO</option>
          <option>Depo AK</option>
          <option>Depo Padalarang</option>
          <option value="__custom">Lainnya…</option>
        </select>
      </div>
      <div class="field" id="sDepotCustomWrap" style="display:none;">
        <input type="text" id="sDepotCustom" placeholder="Nama gudang">
      </div>
      <div class="field">
        <label>Alamat / keterangan (opsional, muncul di nota)</label>
        <input type="text" id="sAddr" placeholder="Contoh: Jl. Raya ... , Bandung">
      </div>
      <div class="sheet-actions">
        <button class="btn btn-ghost" onclick="closeSettings()">Batal</button>
        <button class="btn btn-primary" onclick="saveSettings()">Simpan</button>
      </div>
    </div>
  </div>

</div>

<script>
/* ================= STORAGE HELPERS ================= */
function safeGet(key, fallback){
  try{
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : fallback;
  }catch(e){ return fallback; }
}
function safeSet(key, val){
  try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){ /* ignore */ }
}

const DEFAULT_SALES = ["Ardiana","Cahya","Fauziah","Riykan","Sugiana"];

let state = {
  cart: [],
  products: safeGet('nota_products', []),      // [{name, harga, count}]
  settings: safeGet('nota_settings', {depot:'Depo MDJ', addr:''}),
  counterMap: safeGet('nota_counters', {}),      // { 'YYYYMMDD': n }
};

/* ================= UTIL ================= */
function rupiah(n){
  n = Math.round(Number(n)||0);
  return 'Rp ' + n.toLocaleString('id-ID');
}
function todayKey(){
  const d = new Date();
  return d.getFullYear().toString() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>t.classList.remove('show'), 1600);
}

/* ================= INIT ================= */
function initHeader(){
  document.getElementById('brandName').textContent = state.settings.depot || 'Depo MDJ';
  const d = new Date();
  const opts = {weekday:'long', day:'numeric', month:'long', year:'numeric'};
  document.getElementById('brandDate').textContent = d.toLocaleDateString('id-ID', opts);
}

function initSalesDropdown(){
  const sel = document.getElementById('fSales');
  sel.innerHTML = '<option value="">Pilih sales…</option>';
  DEFAULT_SALES.forEach(name=>{
    const o = document.createElement('option');
    o.value = name; o.textContent = name;
    sel.appendChild(o);
  });
  const o2 = document.createElement('option');
  o2.value = '__custom'; o2.textContent = 'Lainnya…';
  sel.appendChild(o2);
}
function handleSalesChange(){
  const v = document.getElementById('fSales').value;
  document.getElementById('fSalesCustomWrap').style.display = (v === '__custom') ? 'block' : 'none';
}
function currentSalesName(){
  const v = document.getElementById('fSales').value;
  if(v === '__custom') return document.getElementById('fSalesCustom').value.trim();
  return v;
}

function renderChips(){
  const row = document.getElementById('chipRow');
  row.innerHTML = '';
  const top = [...state.products].sort((a,b)=> (b.count||0)-(a.count||0)).slice(0,10);
  if(top.length === 0){
    row.innerHTML = '<div class="chip-empty">Belum ada produk cepat. Tambahkan item, otomatis tersimpan di sini.</div>';
    return;
  }
  top.forEach(p=>{
    const c = document.createElement('div');
    c.className = 'chip';
    c.textContent = p.name + ' · ' + rupiah(p.harga);
    c.onclick = ()=>{
      document.getElementById('fName').value = p.name;
      document.getElementById('fHarga').value = p.harga;
      document.getElementById('fQty').value = 1;
      document.getElementById('fQty').focus();
    };
    row.appendChild(c);
  });
}

function stepQty(delta){
  const q = document.getElementById('fQty');
  let v = parseInt(q.value||'1',10) + delta;
  if(v < 1) v = 1;
  q.value = v;
}

/* ================= CART ================= */
function addItem(){
  const name = document.getElementById('fName').value.trim();
  const harga = parseFloat(document.getElementById('fHarga').value);
  const qty = parseInt(document.getElementById('fQty').value || '1', 10);

  if(!name){ showToast('Nama produk belum diisi'); document.getElementById('fName').focus(); return; }
  if(!harga || harga <= 0){ showToast('Harga belum diisi'); document.getElementById('fHarga').focus(); return; }
  if(!qty || qty <= 0){ showToast('Qty tidak valid'); return; }

  state.cart.push({name, harga, qty});

  // update quick product list
  let p = state.products.find(x=>x.name.toLowerCase() === name.toLowerCase());
  if(p){ p.harga = harga; p.count = (p.count||0) + 1; }
  else{ state.products.push({name, harga, count:1}); }
  safeSet('nota_products', state.products);

  document.getElementById('fName').value = '';
  document.getElementById('fHarga').value = '';
  document.getElementById('fQty').value = 1;
  document.getElementById('fName').focus();

  renderChips();
  renderCart();
  showToast('Item ditambahkan');
}

function removeItem(idx){
  state.cart.splice(idx,1);
  renderCart();
}

function cartTotal(){
  return state.cart.reduce((s,i)=> s + i.harga*i.qty, 0);
}

function renderCart(){
  const list = document.getElementById('cartList');
  const countEl = document.getElementById('cartCount');
  countEl.textContent = state.cart.length ? '(' + state.cart.length + ')' : '';

  if(state.cart.length === 0){
    list.innerHTML = '<div class="cart-empty"><span class="big">🛒</span>Belum ada item. Tambahkan produk di atas.</div>';
  }else{
    list.innerHTML = '';
    state.cart.forEach((item, idx)=>{
      const row = document.createElement('div');
      row.className = 'cart-item';
      row.innerHTML = `
        <div class="info">
          <div class="pname">${escapeHtml(item.name)}</div>
          <div class="pmeta">${item.qty} x ${rupiah(item.harga)}</div>
        </div>
        <div class="psub">${rupiah(item.qty*item.harga)}</div>
        <button class="del" onclick="removeItem(${idx})">✕</button>
      `;
      list.appendChild(row);
    });
  }

  const total = cartTotal();
  document.getElementById('stickyTotal').textContent = rupiah(total);
  document.getElementById('btnBuatNota').disabled = state.cart.length === 0;
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ================= NOTA ================= */
function nextNotaNumber(){
  const key = todayKey();
  const n = (state.counterMap[key] || 0) + 1;
  state.counterMap[key] = n;
  safeSet('nota_counters', state.counterMap);
  const kode = (state.settings.depot||'DEPO').replace(/[^A-Za-z]/g,'').toUpperCase().slice(0,4) || 'DEPO';
  return kode + '-' + key + '-' + String(n).padStart(3,'0');
}

function generateNota(){
  if(state.cart.length === 0){ showToast('Keranjang masih kosong'); return; }
  const toko = document.getElementById('fToko').value.trim();
  const sales = currentSalesName();
  if(!toko){ showToast('Nama toko belum diisi'); document.getElementById('fToko').focus(); return; }
  if(!sales){ showToast('Pilih atau isi nama sales'); return; }

  const now = new Date();
  const tglStr = now.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}) +
                 ' · ' + now.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});

  document.getElementById('notaStore').textContent = state.settings.depot || 'Depo MDJ';
  document.getElementById('notaAddr').textContent = state.settings.addr || '';
  document.getElementById('notaAddr').style.display = state.settings.addr ? 'block':'none';
  document.getElementById('notaNo').textContent = nextNotaNumber();
  document.getElementById('notaTgl').textContent = tglStr;
  document.getElementById('notaSales').textContent = sales;
  document.getElementById('notaToko').textContent = toko;

  const itemsEl = document.getElementById('notaItems');
  itemsEl.innerHTML = '';
  state.cart.forEach(item=>{
    const li = document.createElement('div');
    li.className = 'li';
    li.innerHTML = `
      <div class="l">${escapeHtml(item.name)}<span class="qtyline">${item.qty} x ${rupiah(item.harga)}</span></div>
      <div class="mono">${rupiah(item.qty*item.harga)}</div>
    `;
    itemsEl.appendChild(li);
  });
  document.getElementById('notaTotal').textContent = rupiah(cartTotal());

  document.getElementById('inputScreen').style.display = 'none';
  document.getElementById('stickybar').style.display = 'none';
  document.getElementById('notaScreen').style.display = 'block';
  window.scrollTo(0,0);
}

function backToForm(){
  document.getElementById('notaScreen').style.display = 'none';
  document.getElementById('inputScreen').style.display = 'block';
  document.getElementById('stickybar').style.display = 'block';
}

function newNota(){
  state.cart = [];
  document.getElementById('fToko').value = '';
  renderCart();
  backToForm();
}

/* ================= SETTINGS ================= */
function openSettings(){
  document.getElementById('sAddr').value = state.settings.addr || '';
  const depotSel = document.getElementById('sDepot');
  const known = ['Depo MDJ','Depo KOPO','Depo AK','Depo Padalarang'];
  if(known.includes(state.settings.depot)){
    depotSel.value = state.settings.depot;
    document.getElementById('sDepotCustomWrap').style.display = 'none';
  }else{
    depotSel.value = '__custom';
    document.getElementById('sDepotCustom').value = state.settings.depot || '';
    document.getElementById('sDepotCustomWrap').style.display = 'block';
  }
  document.getElementById('settingsOverlay').classList.add('show');
}
function closeSettings(){
  document.getElementById('settingsOverlay').classList.remove('show');
}
function handleDepotChange(){
  const v = document.getElementById('sDepot').value;
  document.getElementById('sDepotCustomWrap').style.display = (v === '__custom') ? 'block' : 'none';
}
function saveSettings(){
  const sel = document.getElementById('sDepot').value;
  const depot = sel === '__custom' ? (document.getElementById('sDepotCustom').value.trim() || 'Depo') : sel;
  state.settings.depot = depot;
  state.settings.addr = document.getElementById('sAddr').value.trim();
  safeSet('nota_settings', state.settings);
  initHeader();
  closeSettings();
  showToast('Pengaturan disimpan');
}

/* ================= BOOT ================= */
initHeader();
initSalesDropdown();
renderChips();
renderCart();
</script>
</body>
</html>
